    <!--
      The display face carries the hero, which is the first thing painted. Preloading it
      avoids a visible reflow when 6.6vw type swaps in. The fonts are self-hosted, so there
      is no third-party connection to warm up.
    -->
    <link
      rel="preload"
      href="fonts/martian-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
