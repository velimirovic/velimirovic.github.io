name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Regenerates the share card, favicons, portrait, sitemap and robots.txt, then
      # prerenders every route to static HTML.
      - name: Build
        run: npm run build

      # Unknown paths fall back to the client-rendered shell, which routes to the
      # not-found view. Prerendered routes are real directories and are served directly.
      - name: Add SPA fallback
        run: cp dist/portfolio/browser/index.csr.html dist/portfolio/browser/404.html

      # GitHub Pages runs Jekyll by default, which would strip any underscore-prefixed path.
      - name: Disable Jekyll
        run: touch dist/portfolio/browser/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
